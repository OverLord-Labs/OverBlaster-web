<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OverBlaster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
  /* The game fills the window as a square; the controls sit under it. Black is see-through on the glasses, so the screen is pure black. */
  :root { --bg:#080b10; --panel:#0e131a; --line:#1d2935; --fg:#e9f2f8; --mute:#8da2b4; --cyan:#00e5ff; --gold:#ffc800; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme: dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:13px/1.4 var(--sans); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px)); overflow:hidden; }
  #stage { width:100%; height:calc(100dvh - 76px); background:#000; border:1px solid var(--line); flex:none; } #stage canvas { cursor:none; }
  .strip { width:100%; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; color:var(--mute); flex:none; }
  .strip .keys { display:flex; flex-wrap:wrap; gap:4px 14px; }
  .strip .btns { display:flex; gap:8px; }
  .strip button { font:inherit; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#000; background:var(--cyan); border:0; padding:8px 14px; cursor:pointer; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .strip button:hover { background:#6ff3ff; } .strip button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .strip kbd { font:inherit; font-weight:700; color:var(--fg); border:1px solid var(--line); padding:0 6px; background:var(--panel); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="strip">
  <div class="keys"><span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> turn</span><span>Mouse aims · <kbd>Space</kbd> or click = “Pew”</span><span><kbd>C</kbd> recentre</span><span id="head">Head: keys</span></div>
  <div class="btns"><button id="mic" type="button">Mic: off</button><button id="mute" type="button">Sound: on</button><button id="skip" type="button" style="visibility:hidden">Skip intro</button></div>
</div>
<script type="module" src="/src/demo/main.ts"></script>
</body>
</html>
