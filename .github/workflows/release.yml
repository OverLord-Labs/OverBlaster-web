# Push a tag like v0.1.0 to publish a release with the game as files other projects can drop in:
#   overblaster.js / overblaster.umd.cjs   the game (ES module / UMD)
#   overblaster.d.ts                       one bundled type declaration file
#   overblaster.html                       the whole game in one file, audio inlined
#   overblaster-assets.zip                 audio/ and logo.png; unzip into the folder you pass as `assetsUrl`
# "Run workflow" builds the same files and keeps them as a run artifact, without making a release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: The tag must match package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"; have=$(node -p "require('./package.json').version")
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME but package.json says $have: bump it (npm version $want --no-git-tag-version) and re-tag"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: overblaster-release
          path: dist/release/*
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "OverBlaster $GITHUB_REF_NAME" --generate-notes
